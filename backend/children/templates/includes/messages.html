{% if messages %}
  <div class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index: 1050; width: 50%; max-width: 600px;">
    {% for message in messages %}
      <div 
        class="alert alert-{{ message.tags }} alert-dismissible fade show text-center shadow" 
        role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
